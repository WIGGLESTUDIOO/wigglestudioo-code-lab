<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Maker</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.note{margin:0;font-size:13px;font-weight:700;opacity:.75}
button{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
button.ghost{background:#fff;color:#e0668f;box-shadow:0 0 0 2px #ffc2d4 inset}
h2{margin:0;font-size:30px}
.box{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px 10px 16px;width:380px;box-shadow:0 8px 20px rgba(255,143,177,.3),0 0 0 3px #ffd6e3 inset}
#pw{flex:1;font-family:monospace;font-size:20px;font-weight:700;word-break:break-all;text-align:left;letter-spacing:1px}
.box button{padding:7px 14px;font-size:14px}
.srow{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
input[type=range]{accent-color:#ff7fa3;width:170px}
.bar{width:300px;height:12px;border-radius:8px;background:#ffd6e3;overflow:hidden}
.bar i{display:block;height:100%;width:30%;border-radius:8px;background:linear-gradient(90deg,#ffb3c9,#ff7fa3);transition:width .5s}
</style></head><body><div id="stage"><h2 class="pacifico">Password Maker</h2>
<div class="box"><span id="pw">••••••••</span><button id="copy" class="ghost">copy</button></div>
<div class="srow"><label>length <b id="len">12</b></label><input id="slider" type="range" min="8" max="24" value="12"></div>
<div class="bar"><i id="fill"></i></div><p id="note" class="note">strength</p>
<button id="make">make password</button></div><script>const SYMBOLS="!@#$%", LENGTH=Number("16");
const LETTERS="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const pw=document.getElementById("pw"),slider=document.getElementById("slider"),len=document.getElementById("len");
const fill=document.getElementById("fill"),note=document.getElementById("note");
slider.value=LENGTH;len.textContent=LENGTH;
function make(){
  const chars=LETTERS+SYMBOLS,n=Number(slider.value),r=new Uint32Array(n);
  crypto.getRandomValues(r);
  pw.textContent=Array.from(r,v=>chars[v%chars.length]).join("");
  fill.style.width=((n-4)/20*100)+"%";
  note.textContent=n<12?"strength: okay":n<16?"strength: strong":"strength: super strong";
}
slider.oninput=()=>{len.textContent=slider.value;make()};
document.getElementById("make").onclick=make;
document.getElementById("copy").onclick=e=>{
  if(navigator.clipboard)navigator.clipboard.writeText(pw.textContent).catch(()=>{});
  e.target.textContent="copied ♥";setTimeout(()=>e.target.textContent="copy",1200);
};
make();
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
