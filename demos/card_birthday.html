<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Card</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
h1{margin:0;font-size:34px;animation:jump 1.6s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-6px)}}
#flame{transform-origin:95px 33px;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.88,1.1) rotate(3deg)}}
.msg{margin:0;font-size:17px;font-weight:700;max-width:380px;line-height:1.4;min-height:44px}
#blow{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
#conf{position:absolute;inset:0;pointer-events:none}
</style></head><body><div id="stage"><h1 id="to" class="pacifico">Happy Birthday!</h1>
<svg id="cake" width="190" height="170" viewBox="0 0 190 170">
 <rect x="30" y="100" width="130" height="55" rx="10" fill="#ffc2d4"/>
 <rect x="48" y="62" width="94" height="42" rx="10" fill="#ffd9c7"/>
 <path d="M30 108q10 14 21 0t21 0 21 0 21 0 21 0 14 0" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
 <rect x="91" y="30" width="8" height="34" rx="3" fill="#ff8fb1"/>
 <ellipse id="flame" cx="95" cy="22" rx="7" ry="11" fill="#ffc94d"/>
</svg>
<p id="msg" class="msg">Make a wish</p>
<button id="blow">blow the candle</button>
<canvas id="conf" width="540" height="480"></canvas></div><script>const NAME="Rhea", MSG="Another year, another reason to celebrate you.";
document.getElementById("to").textContent="Happy Birthday "+NAME+"!";
const cv=document.getElementById("conf"),x=cv.getContext("2d"),COL=["#ff8fb1","#ffd9c7","#ffe28a","#bde6ff","#d7c2ff"];
let bits=[];
document.getElementById("blow").onclick=()=>{
  document.getElementById("flame").style.display="none";
  document.getElementById("msg").textContent=MSG;
  for(let i=0;i<110;i++)bits.push({x:Math.random()*540,y:-Math.random()*300,vy:1.5+Math.random()*2.5,vx:Math.random()*2-1,r:Math.random()*6,vr:Math.random()*.2-.1,c:COL[i%5]});
};
(function loop(){x.clearRect(0,0,540,480);
  for(const b of bits){b.y+=b.vy;b.x+=b.vx;b.r+=b.vr;x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle=b.c;x.fillRect(-4,-2,9,5);x.restore()}
  bits=bits.filter(b=>b.y<500);requestAnimationFrame(loop)})();
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
