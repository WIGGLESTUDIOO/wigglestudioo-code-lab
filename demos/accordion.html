<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ Accordion</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  font-family: "Poppins", system-ui, sans-serif;
  color: #e8eaf6;
  background: radial-gradient(circle at 50% 0%, #2d1757, #0b0d17 65%);
  display: grid; place-items: center;
}

.faq { width: 760px; zoom: 1.12; }
h1 { text-align: center; font-size: 46px; margin-bottom: 30px; }
.item { margin-bottom: 16px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); overflow: hidden; }
.q { width: 100%; display: flex; justify-content: space-between; padding: 22px 26px; font: 600 22px Poppins, sans-serif; color: #fff; background: none; border: 0; cursor: pointer; }
.q span { color: #ff78be; transition: transform .4s; }
.item.open .q span { transform: rotate(45deg); }
.answer { max-height: 0; overflow: hidden; transition: max-height .4s; }
.answer p { padding: 0 26px 24px; font-size: 19px; line-height: 1.6; color: #b9bddb; }
.item.open .answer { max-height: 100px; }

</style>
</head>
<body>
<div class="faq"><h1>FAQ</h1>
<div class="item"><button class="q">Is it free? <span>+</span></button><div class="answer"><p>Yes! Free code, free to use, free to change.</p></div></div>
<div class="item"><button class="q">Do I need a framework? <span>+</span></button><div class="answer"><p>Nope. Just HTML, CSS and a tiny bit of JavaScript.</p></div></div>
<div class="item"><button class="q">Works on mobile? <span>+</span></button><div class="answer"><p>Yes, it fits any screen size.</p></div></div></div>
<script>
document.querySelectorAll(".q").forEach(q => {
  q.onclick = () => {
    q.parentElement.classList.toggle("open");
  };
});
</script>
</body>
</html>
