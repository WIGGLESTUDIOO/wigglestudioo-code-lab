<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP Input Box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      font-size: 18px;
      color: #e8eaf6;
      background: radial-gradient(circle at 80% 10%, #2d1757, #0b0d17 60%);
    }
    .card {
      width: 520px;
      padding: 50px 40px;
      text-align: center;
      border-radius: 26px;
      background: rgba(21, 26, 46, .85);
      border: 1px solid rgba(120, 220, 255, .25);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
    }
    h1 { font-size: 34px; margin-bottom: 8px; }
    p { color: #8b90b0; font-size: 16px; }
    .boxes { display: flex; justify-content: center; gap: 16px; margin: 38px 0 26px; }
    .boxes input {
      width: 76px;
      height: 92px;
      text-align: center;
      font: inherit;
      font-size: 38px;
      font-weight: 600;
      color: #e8eaf6;
      background: #0f1324;
      border: 2px solid #2a3050;
      border-radius: 16px;
      outline: none;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    .boxes input:focus {
      border-color: #ff78be;
      box-shadow: 0 0 0 5px rgba(255, 120, 190, .18);
      transform: translateY(-4px);
    }
    .boxes.ok input { border-color: #4ade80; color: #4ade80; }
    .boxes.bad input { border-color: #ff6b6b; color: #ff6b6b; }
    .boxes.bad { animation: shake .4s; }
    @keyframes shake {
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    #msg { height: 26px; font-weight: 600; color: #4ade80; }
    #msg.bad { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter code</h1>
    <p>We sent a 4-digit code to your phone</p>
    <div class="boxes" id="boxes">
      <input maxlength="1" inputmode="numeric" autofocus>
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
    </div>
    <p id="msg"></p>
  </div>

  <script>
    const wrap = document.getElementById("boxes");
    const boxes = [...wrap.querySelectorAll("input")];
    const msg = document.getElementById("msg");

    boxes.forEach((box, i) => {
      // jump to the next box when a digit is typed
      box.oninput = () => {
        box.value = box.value.replace(/\D/g, "");
        if (box.value) boxes[i + 1]?.focus();
        check();
      };
      // backspace on an empty box goes back
      box.onkeydown = (e) => {
        if (e.key === "Backspace" && !box.value) boxes[i - 1]?.focus();
      };
    });

    function check() {
      const code = boxes.map((b) => b.value).join("");
      wrap.className = "boxes";
      msg.className = "";
      msg.textContent = "";
      if (code.length < 4) return;
      if (code === "1234") {          // demo code
        wrap.classList.add("ok");
        msg.textContent = "Verified ✓";
      } else {
        wrap.classList.add("bad");
        msg.classList.add("bad");
        msg.textContent = "Wrong code, try again";
      }
    }
  </script>
</body>
</html>
