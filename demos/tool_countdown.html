<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.note{margin:0;font-size:13px;font-weight:700;opacity:.75}
button{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
button.ghost{background:#fff;color:#e0668f;box-shadow:0 0 0 2px #ffc2d4 inset}
h2{margin:0;font-size:30px}
.top{margin:0;font-size:32px}
.big{display:flex;align-items:baseline;gap:10px;color:#e0668f}
.big b{font-size:110px;line-height:1;text-shadow:0 8px 20px rgba(255,143,177,.45)}
.big span{font-size:26px;font-weight:700}
.small{display:flex;gap:14px}
.small div{background:#fff;border-radius:18px;padding:10px 0;width:92px;font-size:13px;font-weight:700;box-shadow:0 8px 18px rgba(255,143,177,.25),0 0 0 3px #ffd6e3 inset;display:flex;flex-direction:column;gap:2px}
.small b{font-size:34px;color:#7a3b52;line-height:1.1}
#s{display:inline-block;animation:tick 1s ease-in-out infinite}
@keyframes tick{0%{transform:scale(1)}15%{transform:scale(1.25);color:#e0668f}40%,100%{transform:scale(1)}}
</style></head><body><div id="stage"><p id="ev" class="pacifico top">The big day</p>
<div class="big"><b id="d">0</b><span>days</span></div>
<div class="small"><div><b id="h">0</b>hours</div><div><b id="m">0</b>min</div><div><b id="s">0</b>sec</div></div>
<p id="foot" class="note">until something wonderful ♥</p></div><script>const EVENT="Birthday Month", DATE="2027-03-01";
document.getElementById("ev").textContent=EVENT;
const target=new Date(DATE).getTime();
const $=id=>document.getElementById(id);
function tick(){
  const diff=Math.max(0,target-Date.now());
  $("d").textContent=Math.floor(diff/864e5);
  $("h").textContent=Math.floor(diff/36e5)%24;
  $("m").textContent=Math.floor(diff/6e4)%60;
  $("s").textContent=Math.floor(diff/1000)%60;
  if(diff==0)$("foot").textContent="It's today! ♥";
}
tick();setInterval(tick,1000);
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
