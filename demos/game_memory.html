<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiggleStudioo - Memory Match</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.note{margin:0;font-size:13px;font-weight:700;opacity:.75}
button{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
button.ghost{background:#fff;color:#e0668f;box-shadow:0 0 0 2px #ffc2d4 inset}
h2{margin:0;font-size:30px}
#grid{display:grid;grid-template-columns:repeat(4,66px);gap:10px}
.mc{height:66px;border-radius:14px;background:linear-gradient(135deg,#ffb3c9,#ff8fb1);display:grid;place-items:center;font-size:30px;color:transparent;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.4);transition:transform .2s,background .2s}
.mc:hover{transform:scale(1.05)}
.mc.up,.mc.done{background:#fff;color:#e0668f;box-shadow:0 0 0 3px #ffd6e3 inset}
.mc.done{background:#ffe3ec}
</style></head><body><div id="stage"><h2 class="pacifico">Memory Match</h2>
<p class="note">find the pairs · moves: <b id="moves">0</b></p>
<div id="grid">
 <div class="mc"></div><div class="mc"></div><div class="mc"></div><div class="mc"></div>
 <div class="mc"></div><div class="mc"></div><div class="mc"></div><div class="mc"></div>
 <div class="mc"></div><div class="mc"></div><div class="mc"></div><div class="mc"></div>
</div>
<p id="msg" class="note">&nbsp;</p>
<button id="again" class="ghost">shuffle</button></div><script>const SYMBOLS="♠ ♣ ♦ ♞ ☂ ☃".split(" ");
const cards=[...document.querySelectorAll(".mc")],moves=document.getElementById("moves"),msg=document.getElementById("msg");
let first=null,lock=false,count=0;
function deal(){
  const deck=[...SYMBOLS,...SYMBOLS].sort(()=>Math.random()-.5);
  cards.forEach((c,i)=>{c.dataset.s=deck[i];c.textContent=deck[i];c.className="mc"});
  first=null;lock=false;count=0;moves.textContent=0;msg.textContent="\u00a0";
}
cards.forEach(c=>c.onclick=()=>{
  if(lock||c===first||c.classList.contains("done"))return;
  c.classList.add("up");
  if(!first){first=c;return}
  moves.textContent=++count;
  if(first.dataset.s===c.dataset.s){
    first.classList.add("done");c.classList.add("done");first=null;
    if(cards.every(x=>x.classList.contains("done")))msg.textContent="You found them all!";
  }else{
    lock=true;
    setTimeout(()=>{first.classList.remove("up");c.classList.remove("up");first=null;lock=false},700);
  }
});
document.getElementById("again").onclick=deal;deal();
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
