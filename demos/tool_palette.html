<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Maker</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.note{margin:0;font-size:13px;font-weight:700;opacity:.75}
button{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
button.ghost{background:#fff;color:#e0668f;box-shadow:0 0 0 2px #ffc2d4 inset}
h2{margin:0;font-size:30px}
.pal{display:flex;gap:8px;width:420px;height:210px}
.sw{flex:1;border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:12px;font-weight:700;cursor:pointer;color:#7a3b52;transition:background .5s,transform .2s;box-shadow:0 8px 18px rgba(255,143,177,.25),0 0 0 4px #fff inset}
.sw:hover{transform:translateY(-6px)}
</style></head><body><div id="stage"><h2 class="pacifico">Palette Maker</h2>
<div class="pal" id="pal"></div>
<button id="new">new colors</button>
<p id="note" class="note">tap a color to copy it</p></div><script>const HUE_START=Number("320"), HUE_RANGE=Number("70");
const pal=document.getElementById("pal"),note=document.getElementById("note");
function hex(h,s,l){
  s/=100;l/=100;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,"0")};
  return "#"+f(0)+f(8)+f(4);
}
function newColors(){
  pal.innerHTML="";
  for(let i=0;i<5;i++){
    const h=(HUE_START+HUE_RANGE*i/4+Math.random()*10)%360;
    const c=hex(h,65+Math.random()*20,82+Math.random()*8);
    const d=document.createElement("div");d.className="sw";d.style.background=c;d.textContent=c;
    d.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(c).catch(()=>{});note.textContent="copied "+c+" ♥"};
    pal.appendChild(d);
  }
}
document.getElementById("new").onclick=newColors;
newColors();
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
