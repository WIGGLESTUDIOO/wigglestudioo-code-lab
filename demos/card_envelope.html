<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Letter</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.env{position:relative;width:300px;height:190px;cursor:pointer;margin-top:90px}
.env div{position:absolute}
.back{inset:0;background:#ff9fbb;border-radius:10px}
.front{inset:0;background:#ffc2d4;border-radius:10px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3}
.flap{left:0;right:0;top:0;height:115px;background:#ff8fb1;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s,z-index 0s .35s;z-index:4;border-radius:10px 10px 0 0}
.seal{left:50%;top:78px;margin-left:-17px;width:34px;height:34px;border-radius:50%;background:#e0668f;color:#fff;display:grid;place-items:center;z-index:5;transition:opacity .3s;position:absolute}
.letter{left:16px;right:16px;top:12px;height:168px;background:#fffaf5;border-radius:10px;z-index:2;transition:transform .8s .35s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);font-size:15px;line-height:1.5}
.letter p{margin:0}.letter b{font-size:20px}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .letter{transform:translateY(-125px)}
.tap{margin:0;font-size:13px;opacity:.7}
</style></head><body><div id="stage"><div class="env" id="env">
 <div class="back"></div>
 <div class="letter"><p id="msg">Dear you,</p><b id="from" class="pacifico">with love</b></div>
 <div class="front"></div>
 <div class="flap"></div>
 <div class="seal">♥</div>
</div>
<p class="tap">tap the envelope</p></div><script>const NAME="Riya", MSG="Thank you for always being there. You are my favourite person.";
document.getElementById("msg").textContent=MSG;
document.getElementById("from").textContent="— "+NAME;
const env=document.getElementById("env");
env.onclick=()=>env.classList.toggle("open");
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
