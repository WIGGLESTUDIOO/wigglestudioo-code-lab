<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Card</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.scene{perspective:1200px;cursor:pointer}
.card{width:250px;height:350px;position:relative;transition:transform .9s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;animation:bob 3.5s ease-in-out infinite}
.card.open{transform:rotateY(180deg);animation:none}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;box-shadow:0 16px 34px rgba(255,143,177,.35),0 0 0 7px #fff inset}
.front{background:linear-gradient(160deg,#ffd6e3,#ffe9d9)}
.back{background:linear-gradient(160deg,#fffaf5,#ffe3ec);transform:rotateY(180deg);font-size:17px;line-height:1.5;font-weight:500}
h1{margin:0;font-size:26px}.sub{margin:0;font-size:13px;font-weight:700;opacity:.8}.back span{font-size:20px}
</style></head><body><div id="stage"><div class="scene" id="scene"><div class="card" id="card">
 <div class="face front"><svg class="bear" width="130" height="130" viewBox="0 0 200 200"><circle cx="55" cy="45" r="26" fill="#f3b58f"/><circle cx="55" cy="45" r="14" fill="#ffd9c7"/><circle cx="145" cy="45" r="26" fill="#f3b58f"/><circle cx="145" cy="45" r="14" fill="#ffd9c7"/><circle cx="100" cy="100" r="64" fill="#f7c7a3"/><ellipse cx="100" cy="122" rx="30" ry="23" fill="#fff0e4"/><ellipse cx="100" cy="112" rx="9" ry="6.5" fill="#7a3b52"/><path d="M100 118v8M100 126q-8 8-15 2M100 126q8 8 15 2" stroke="#7a3b52" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="76" cy="92" r="7" fill="#7a3b52"/><circle cx="124" cy="92" r="7" fill="#7a3b52"/><circle cx="78" cy="89" r="2.4" fill="#fff"/><circle cx="126" cy="89" r="2.4" fill="#fff"/><ellipse cx="58" cy="112" rx="11" ry="7" fill="#ff9fb8" opacity=".7"/><ellipse cx="142" cy="112" rx="11" ry="7" fill="#ff9fb8" opacity=".7"/><path d="M100 186c-34-22-42-40-30-52 10-9 24-4 30 8 6-12 20-17 30-8 12 12 4 30-30 52z" fill="#ff7fa3" transform="translate(0,-4) scale(.8) translate(25,38)"/></svg><h1 id="to" class="pacifico">For You</h1><p class="sub">I made you something small</p></div>
 <div class="face back"><p id="msg">I love you</p><span id="from" class="pacifico">with love</span></div>
</div></div></div><script>const NAME="Mom", MSG="You make every day softer and sunnier.";
document.getElementById("to").textContent="For "+NAME;
document.getElementById("msg").textContent=MSG;
const card=document.getElementById("card");
card.onclick=()=>card.classList.toggle("open");
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
