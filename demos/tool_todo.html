<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do List</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.note{margin:0;font-size:13px;font-weight:700;opacity:.75}
button{font:inherit;font-weight:700;color:#fff;background:#ff8fb1;border:none;border-radius:20px;padding:9px 22px;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.45)}
button.ghost{background:#fff;color:#e0668f;box-shadow:0 0 0 2px #ffc2d4 inset}
h2{margin:0;font-size:30px}
.prog{width:340px;height:12px;border-radius:8px;background:#ffd6e3;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ffb3c9,#ff7fa3);transition:width .5s}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:340px}
li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:9px 14px;font-weight:700;font-size:16px;text-align:left;cursor:pointer;box-shadow:0 6px 14px rgba(255,143,177,.22),0 0 0 2px #ffd6e3 inset;transition:transform .2s}
li .h{color:#ffb3c9;font-size:22px;line-height:1}
li.done{color:#e0668f;text-decoration:line-through;opacity:.8}li.done .h{color:#ff7fa3}
.add{display:flex;gap:8px}
input{font:inherit;font-weight:500;width:230px;border:none;border-radius:20px;padding:9px 16px;background:#fff;color:#7a3b52;box-shadow:0 0 0 3px #ffd6e3 inset;outline:none}
.add button{padding:9px 18px}
</style></head><body><div id="stage"><h2 id="title" class="pacifico">My To-Do</h2>
<div class="prog"><i id="bar"></i></div><p id="count" class="note">0 / 0 done</p>
<ul id="list"></ul>
<div class="add"><input id="inp" placeholder="add a task..."><button id="addb">add</button></div></div><script>const TITLE="Rhea's Day", START="Drink water,Study one hour,Call mom".split(",");
document.getElementById("title").textContent=TITLE;
const tasks=START.map(t=>({text:t.trim(),done:false}));
const list=document.getElementById("list"),bar=document.getElementById("bar"),count=document.getElementById("count"),inp=document.getElementById("inp");
function draw(){
  list.innerHTML="";
  tasks.forEach(t=>{
    const li=document.createElement("li");if(t.done)li.className="done";
    li.innerHTML='<span class="h">'+(t.done?"♥":"♡")+"</span>"+t.text;
    li.onclick=()=>{t.done=!t.done;draw()};list.appendChild(li);
  });
  const d=tasks.filter(t=>t.done).length;
  bar.style.width=(tasks.length?d/tasks.length*100:0)+"%";
  count.textContent=d==tasks.length&&d>0?"all done! so proud of you ♥":d+" / "+tasks.length+" done";
}
function add(){if(!inp.value.trim())return;tasks.push({text:inp.value.trim(),done:false});inp.value="";draw()}
document.getElementById("addb").onclick=add;
inp.onkeydown=e=>{if(e.key=="Enter")add()};
draw();
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
