<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Cards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Poppins", system-ui, sans-serif;
  color: #e8eaf6;
  background: radial-gradient(circle at 50% 0%, #2d1757, #0b0d17 65%);
}
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 860px; }
.card {
  background: rgba(255,255,255,.07);
  border-radius: 18px;
  padding: 20px;
  transition: transform .3s, box-shadow .3s;
}
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px #ff78be40;
}
.thumb { height: 130px; border-radius: 12px; display: grid; place-items: center; font-size: 48px; margin-bottom: 14px; background: linear-gradient(135deg, #7c5cff, #ff78be); }
.card:nth-child(2) .thumb { background: linear-gradient(135deg, #22d3ee, #6366f1); }
.card:nth-child(3) .thumb { background: linear-gradient(135deg, #fb923c, #ff78be); }
h3 { margin-bottom: 6px; }
p { color: #a9a6d4; font-size: 15px; }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><div class="thumb">🎨</div><h3>Project one</h3><p>Hover me!</p></div>
  <div class="card"><div class="thumb">🚀</div><h3>Project two</h3><p>I float up too.</p></div>
  <div class="card"><div class="thumb">🌸</div><h3>Project three</h3><p>Soft pink glow.</p></div>
</div>
</body>
</html>
