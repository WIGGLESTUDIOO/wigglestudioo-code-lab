<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Light Toggle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      font-size: 18px;
      color: #e8eaf6;
      background: radial-gradient(circle at 50% 0%, #2d1757, #0b0d17 65%);
      transition: background .5s, color .5s;
    }
    body.light {
      color: #1b1e33;
      background: radial-gradient(circle at 50% 0%, #ffe3f1, #f4f7ff 65%);
    }
    .box { text-align: center; }
    h1 { font-size: 46px; margin-bottom: 8px; }
    p { color: #8b90b0; margin-bottom: 44px; transition: color .5s; }
    body.light p { color: #5d627e; }
    .switch {
      position: relative;
      width: 150px;
      height: 76px;
      border: none;
      border-radius: 76px;
      background: #1b2140;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, .5);
      cursor: pointer;
      transition: background .4s;
    }
    .switch.on { background: #9bdcff; box-shadow: inset 0 4px 14px rgba(0, 0, 0, .15); }
    .knob {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      font-size: 30px;
      border-radius: 50%;
      background: #0b0d17;
      transition: transform .4s cubic-bezier(.6, -.3, .3, 1.3), background .4s;
    }
    .switch.on .knob {
      transform: translateX(74px);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">Good night</h1>
    <p>Tap the switch to change the mood</p>
    <button class="switch" id="sw"><span class="knob" id="knob">🌙</span></button>
  </div>

  <script>
    const sw = document.getElementById("sw");
    const title = document.getElementById("title");
    const knob = document.getElementById("knob");

    sw.onclick = () => {
      sw.classList.toggle("on");
      document.body.classList.toggle("light");
      const light = sw.classList.contains("on");
      title.textContent = light ? "Good morning" : "Good night";
      knob.textContent = light ? "☀️" : "🌙";
    };
  </script>
</body>
</html>
