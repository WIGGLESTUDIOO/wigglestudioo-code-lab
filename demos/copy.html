<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Button</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  font-family: "Poppins", system-ui, sans-serif;
  color: #e8eaf6;
  background: radial-gradient(circle at 50% 0%, #2d1757, #0b0d17 65%);
  display: grid; place-items: center;
}

.box { zoom: 1.12; width: 780px; border-radius: 20px; overflow: hidden; background: #14122b; border: 1px solid #3a3566; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #1d1a3a; color: #8b88b8; font-size: 18px; }
#btn { padding: 8px 20px; border: 0; border-radius: 10px; font: 600 16px Poppins, sans-serif; cursor: pointer; color: #1a1030; background: linear-gradient(90deg, #ff78be, #78dcff); transition: transform .2s, background .3s; }
#btn:hover { transform: scale(1.06); }
#btn.done { background: #7af0a8; }
pre { padding: 26px 24px; font: 24px/1.6 "DejaVu Sans Mono", monospace; color: #cfd3ff; }
.k { color: #ff78be; } .s { color: #7af0a8; }

</style>
</head>
<body>
<div class="box"><div class="bar"><span>index.html</span><button id="btn">Copy</button></div><pre id="snippet"><span class="k">const</span> hello = <span class="s">"Hi!"</span>;
console.log(hello);</pre></div>
<script>
const btn = document.getElementById("btn");
btn.onclick = () => {
  navigator.clipboard.writeText(snippet.innerText).catch(() => {});
  btn.textContent = "Copied!";
  btn.classList.add("done");
  setTimeout(() => {
    btn.textContent = "Copy";
    btn.classList.remove("done");
  }, 1500);
};
</script>
</body>
</html>
