<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch & Load</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
#stage{--main:#ff8fb1;--dk:color-mix(in srgb,var(--main) 72%,#5a2a40)}
.note{margin:0;font-size:15px;font-weight:700;opacity:.7}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{font:inherit;font-weight:700;font-size:26px;color:#fff;background:var(--main);border:none;border-radius:24px;padding:0 48px;height:76px;min-width:330px;cursor:pointer;position:relative}
#stage{gap:44px}
.sw{display:flex;align-items:center;gap:16px;cursor:pointer;font-size:24px}
.sw input{display:none}
.sw span{width:80px;height:44px;border-radius:20px;background:#ffd6e3;position:relative;transition:background .3s}
.sw span::after{content:"";position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+span{background:var(--main)}
.sw input:checked+span::after{transform:translateX(36px)}
.load{display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(255,143,177,.4);transition:background .3s}
.load.busy::after{content:"";width:30px;height:30px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.load.ok{background:#7fd8b5}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div id="stage"><div class="cell"><label class="sw"><input type="checkbox" id="t"><span></span><b>sleepy mode</b></label><p class="note">9 · toggle switch</p></div>
<div class="cell"><button class="btn load" id="lab">send it</button><p class="note">10 · loading button</p></div></div><script>const COLOR="#a78bfa", LABEL="Send love";
document.getElementById("stage").style.setProperty("--main",COLOR);
document.getElementById("lab").textContent=LABEL;
const load=document.getElementById("lab");
load.onclick=()=>{
  if(load.classList.contains("busy")||load.classList.contains("ok"))return;
  load.classList.add("busy");load.textContent="";
  setTimeout(()=>{
    load.classList.remove("busy");load.classList.add("ok");load.textContent="done ✓";
    setTimeout(()=>{load.classList.remove("ok");load.textContent=LABEL},1400);
  },1400);
};
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
