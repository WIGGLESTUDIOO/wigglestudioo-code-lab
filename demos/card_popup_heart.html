<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop-up Heart</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
.bigheart{font-size:150px;line-height:1;color:#ff7fa3;background:none;border:none;cursor:pointer;animation:beat 1.1s ease-in-out infinite;text-shadow:0 10px 24px rgba(255,127,163,.45);padding:0}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(1)}60%{transform:scale(1.08)}}
.msg{margin:0;font-size:19px;font-weight:700;max-width:380px;line-height:1.45;min-height:56px;transition:opacity .4s}
.mini{position:absolute;left:50%;top:44%;color:#ff8fb1;pointer-events:none;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
</style></head><body><div id="stage"><button id="heart" class="bigheart">♥</button>
<p id="msg" class="msg">Tap the heart</p></div><script>const MSG="I love you more than pizza. Yes, really.";
const heart=document.getElementById("heart"),msg=document.getElementById("msg");
heart.onclick=()=>{
  for(let i=0;i<22;i++){
    const m=document.createElement("div");m.className="mini";m.textContent="♥";
    const a=Math.random()*6.28,d=90+Math.random()*130;
    m.style.setProperty("--dx",Math.cos(a)*d+"px");m.style.setProperty("--dy",Math.sin(a)*d+"px");
    m.style.setProperty("--r",(Math.random()*120-60)+"deg");m.style.fontSize=(14+Math.random()*26)+"px";
    document.getElementById("stage").appendChild(m);setTimeout(()=>m.remove(),1500);
  }
  msg.textContent=MSG;
};
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
