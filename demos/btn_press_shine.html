<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Press & Shine</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}#stage{position:relative;width:100%;height:100vh;overflow:hidden}</style><style>*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Quicksand',sans-serif;color:#7a3b52;text-align:center;background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 45%),radial-gradient(circle at 85% 85%,#ffe9d9,transparent 45%),#fff0f4}
.hbg{position:absolute;bottom:-40px;color:#ff8fb1;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pacifico{font-family:'Pacifico',cursive;font-weight:400;color:#e0668f}
#stage{--main:#ff8fb1;--dk:color-mix(in srgb,var(--main) 72%,#5a2a40)}
.note{margin:0;font-size:15px;font-weight:700;opacity:.7}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{font:inherit;font-weight:700;font-size:26px;color:#fff;background:var(--main);border:none;border-radius:24px;padding:0 48px;height:76px;min-width:330px;cursor:pointer;position:relative}
#stage{gap:44px}
.b3d{box-shadow:0 10px 0 var(--dk);transition:transform .1s,box-shadow .1s}
.b3d:hover{transform:translateY(2px);box-shadow:0 8px 0 var(--dk)}
.b3d:active{transform:translateY(10px);box-shadow:0 0 0 var(--dk)}
.shine{overflow:hidden;box-shadow:0 8px 18px rgba(255,143,177,.4)}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg)}
.shine:hover::after{left:130%;transition:left .6s}
</style></head><body><div id="stage"><div class="cell"><button class="btn b3d" id="lab">press me</button><p class="note">1 · squishy press</p></div>
<div class="cell"><button class="btn shine">shine</button><p class="note">2 · shine sweep</p></div></div><script>const COLOR="#c9a7ff", LABEL="Tap me gently";
document.getElementById("stage").style.setProperty("--main",COLOR);
document.getElementById("lab").textContent=LABEL;
const S=document.getElementById("stage");
function bgHeart(){const h=document.createElement("div");h.className="hbg";h.textContent="♥";h.style.left=Math.random()*100+"%";h.style.fontSize=(12+Math.random()*22)+"px";h.style.animationDuration=(5+Math.random()*5)+"s";S.appendChild(h);setTimeout(()=>h.remove(),10500)}
for(let i=0;i<10;i++)setTimeout(bgHeart,i*300);setInterval(bgHeart,650);
</script></body></html>
