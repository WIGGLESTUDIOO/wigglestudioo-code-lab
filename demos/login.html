<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Login Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      font-size: 18px;
      color: #e8eaf6;
      background: radial-gradient(circle at 20% 15%, #2d1757, #0b0d17 60%);
    }
    .card {
      width: 460px;
      padding: 46px 40px;
      border-radius: 26px;
      background: rgba(21, 26, 46, .85);
      border: 1px solid rgba(255, 120, 190, .25);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
    }
    h1 { font-size: 36px; margin-bottom: 6px; }
    .sub { color: #8b90b0; font-size: 16px; margin-bottom: 32px; }
    .field { position: relative; margin-bottom: 24px; }
    .field input {
      width: 100%;
      padding: 24px 46px 10px 16px;
      border-radius: 14px;
      border: 1px solid #2a3050;
      background: #0f1324;
      color: #e8eaf6;
      font: inherit;
      outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    .field label {
      position: absolute;
      left: 16px;
      top: 17px;
      color: #8b90b0;
      pointer-events: none;
      transition: all .25s;
    }
    input:focus + label,
    input:not(:placeholder-shown) + label {
      top: 6px;
      font-size: 12px;
      color: #ff78be;
    }
    input:focus {
      border-color: #ff78be;
      box-shadow: 0 0 0 4px rgba(255, 120, 190, .18);
    }
    .eye {
      position: absolute;
      right: 14px;
      top: 16px;
      background: none;
      border: none;
      color: #8b90b0;
      font-size: 18px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-weight: 600;
      color: #0b0d17;
      cursor: pointer;
      background: linear-gradient(90deg, #ff78be, #78dcff);
      transition: transform .2s, box-shadow .2s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(255, 120, 190, .4);
    }
    .btn.done { background: linear-gradient(90deg, #4ade80, #78dcff); }
    .foot { text-align: center; margin-top: 22px; font-size: 15px; color: #8b90b0; }
    .foot a { color: #78dcff; text-decoration: none; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue</p>

    <div class="field">
      <input type="email" id="email" placeholder=" " required>
      <label for="email">Email</label>
    </div>

    <div class="field">
      <input type="password" id="pass" placeholder=" " required>
      <label for="pass">Password</label>
      <button type="button" class="eye" id="eye">👁</button>
    </div>

    <button class="btn" id="btn" type="submit">Log in</button>
    <p class="foot">New here? <a href="#">Create account</a></p>
  </form>

  <script>
    const pass = document.getElementById("pass");
    const eye = document.getElementById("eye");
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");

    // show / hide password
    eye.onclick = () => {
      pass.type = pass.type === "password" ? "text" : "password";
    };

    // fake login (no server), just a happy message
    form.onsubmit = (e) => {
      e.preventDefault();
      btn.textContent = "Welcome back ✓";
      btn.classList.add("done");
    };
  </script>
</body>
</html>
